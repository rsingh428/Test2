<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Valentine’s Day ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    margin: 0;
    font-family: 'Georgia', serif;
    background: linear-gradient(120deg, #ff9a9e, #fad0c4);
    color: #4a2c2a;
    text-align: center;
    overflow-x: hidden;
  }

  h1 {
    margin-top: 40px;
    font-size: 2.6em;
    animation: fadeIn 2s ease;
  }

  .heart {
    font-size: 2em;
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.25); }
    100% { transform: scale(1); }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card {
    background: white;
    margin: 30px auto;
    padding: 25px;
    width: 90%;
    max-width: 600px;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    animation: fadeIn 2s ease;
  }

  .message {
    font-size: 1.2em;
    line-height: 1.6;
    min-height: 60px;
  }

  .countdown {
    font-size: 1.3em;
    margin-top: 10px;
  }

  .buttons {
    margin-top: 20px;
    position: relative;
    height: 90px;
  }

  button {
    background: #ff5e7e;
    border: none;
    color: white;
    padding: 15px 25px;
    font-size: 1em;
    border-radius: 30px;
    cursor: pointer;
    margin: 10px;
    transition: transform 0.2s, background 0.2s;
  }

  button:hover {
    background: #ff3f63;
    transform: scale(1.1);
  }

  #noBtn {
    position: absolute;
    background: #aaa;
  }

  footer {
    margin: 30px 0;
    font-size: 0.9em;
  }

  .floating-heart {
    position: fixed;
    bottom: -20px;
    font-size: 20px;
    animation: floatUp 6s linear infinite;
    opacity: 0.7;
  }

  @keyframes floatUp {
    from { transform: translateY(0); opacity: 0.7; }
    to { transform: translateY(-100vh); opacity: 0; }
  }

  /* HACK MODAL */
  #hackModal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    color: white;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
  }
</style>
</head>

<body>

<audio autoplay loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<h1>Happy Valentine’s Day, Yamini ❤️</h1>
<div class="heart">💖</div>

<div class="card">
  <h2>Hey Yamini 💕</h2>
  <p class="message" id="typingText"></p>
</div>

<div class="card">
  <h2>Countdown to Our Date ⏳</h2>
  <div class="countdown" id="countdown"></div>
</div>

<div class="card">
  <h2>One Question 💌</h2>
  <p class="message">Will you be my Valentine?</p>

  <div class="buttons">
    <button onclick="sayYes()">YES ❤️</button>
    <button id="noBtn" onclick="noClicked()" onmouseover="moveNo()">NO 😜</button>
  </div>
</div>

<footer>
  Made with love, just for you 💞
</footer>

<!-- HACK MODAL -->
<div id="hackModal">
